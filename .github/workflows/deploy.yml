name: CI and production deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sas-reserve-production
  cancel-in-progress: false

jobs:
  frontend-ci:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  backend-ci:
    name: Django checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sas_test
          POSTGRES_USER: sas_test
          POSTGRES_PASSWORD: sas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sas_test -d sas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: github-actions-ci-only-key-not-for-deployment
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: ""
      DB_CONNECTION: pgsql
      DB_DATABASE: sas_test
      DB_USERNAME: sas_test
      DB_PASSWORD: sas_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run Django checks
        working-directory: backend
        run: python manage.py check

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Configure pinned SSH access
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_KNOWN_HOSTS" || -z "$DEPLOY_SSH_KEY" ]]; then
            echo "::error::Set DEPLOY_HOST, DEPLOY_KNOWN_HOSTS, and DEPLOY_SSH_KEY."
            exit 1
          fi

          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/id_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_key" "$RUNNER_TEMP/deploy-ssh/known_hosts"

          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$RUNNER_TEMP/deploy-ssh/known_hosts" >/dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS does not contain a pinned key for DEPLOY_HOST."
            exit 1
          fi

      - name: Update master and deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_PATH" ]]; then
            echo "::error::Set DEPLOY_HOST, DEPLOY_USER, and DEPLOY_PATH."
            exit 1
          fi

          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          ssh \
            -i "$RUNNER_TEMP/deploy-ssh/id_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $remote_path" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd -- "$1"

          if [[ "$(git branch --show-current)" != "master" ]]; then
            echo "Deployment stopped: server checkout is not on master."
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "Deployment stopped: sas cannot access the Docker daemon."
            exit 1
          fi

          if ! git remote get-url origin | grep -Eq 'github\.com[:/]chan2s/sas-smart-reservation-system(\.git)?$'; then
            echo "Deployment stopped: origin is not the expected GitHub repository."
            exit 1
          fi

          git fetch --quiet origin master

          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "Deployment stopped: server master has diverged from origin/master."
            exit 1
          fi

          # Keep the server's production nginx override when it does not
          # conflict with incoming master. If both sides changed the file,
          # refuse the update rather than overwrite the production edit.
          if ! git diff --quiet HEAD origin/master -- frontend/nginx.prod.conf \
            && ! git diff --quiet HEAD -- frontend/nginx.prod.conf; then
            echo "Deployment stopped: frontend/nginx.prod.conf changed both locally and on origin/master."
            exit 1
          fi

          git merge --ff-only origin/master

          docker compose -f compose.prod.yaml up -d --build frontend backend

          for service in db backend frontend; do
            container_id="$(docker compose -f compose.prod.yaml ps -q "$service")"
            if [[ -z "$container_id" ]]; then
              echo "Deployment failed: no container exists for $service."
              docker compose -f compose.prod.yaml ps
              exit 1
            fi

            health="starting"
            for attempt in $(seq 1 36); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")"
              if [[ "$health" == "healthy" ]]; then
                break
              fi
              if [[ "$health" == "unhealthy" || "$health" == "no-healthcheck" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$health" != "healthy" ]]; then
              echo "Deployment failed: $service health status is $health."
              docker compose -f compose.prod.yaml ps
              exit 1
            fi
          done

          # Verify Django directly and through the frontend proxy.
          # The proxy check must use the production Host header because
          # Django may reject the default Host: frontend.
          docker compose -f compose.prod.yaml exec -T backend python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"
          docker compose -f compose.prod.yaml exec -T backend python -c \
            "import urllib.request; req=urllib.request.Request('http://frontend/api/health/', headers={'Host':'103.68.157.45:4816'}); urllib.request.urlopen(req, timeout=10)"

          docker compose -f compose.prod.yaml ps --format 'table {{.Service}}\t{{.State}}\t{{.Health}}'
          REMOTE_SCRIPT