
name: sas-reserve

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:

      DB_HOST: ${DEV_DB_HOST:-host.docker.internal}
      VAPID_PRIVATE_KEY: /run/secrets/vapid_private_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./private_key.pem:/run/secrets/vapid_private_key:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:

      DEV_PROXY_TARGET: http://backend:8000

      DEV_USE_POLLING: "${DEV_USE_POLLING:-true}"
    volumes:
      - ./frontend:/app

      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  # Docker-managed so the container's Linux dependencies never mix with the
  # host's Windows node_modules. Safe to delete with
  # `docker compose down --volumes`; it only ever holds reinstalled packages.
  frontend_node_modules:
